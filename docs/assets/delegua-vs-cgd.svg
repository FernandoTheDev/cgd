<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="1120" height="340" role="img" aria-label="Comparação entre Delégua original da Design Líquido e o CGD">
  <defs>
    <linearGradient id="cmpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090912"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="340" rx="16" fill="url(#cmpBg)" stroke="#231f3a" stroke-width="1.5"/>
  <text x="32" y="42" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" letter-spacing="1.2">// MESMA RAIZ EM PORTUGUÊS, ARQUITETURAS DIFERENTES</text>

  <!-- Left Card: Delegua Original -->
  <rect x="28" y="64" width="510" height="248" rx="14" fill="#0b0e17" stroke="#2d5a7b" stroke-width="1.5"/>
  <rect x="48" y="82" width="190" height="24" rx="6" fill="#4da8da" fill-opacity="0.16"/>
  <text x="60" y="98" fill="#7dd3fc" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">DELÉGUA ORIGINAL (WIKI)</text>
  <text x="48" y="132" fill="#f3f4f8" font-family="Inter, sans-serif" font-size="20" font-weight="800">Interpretador Design Líquido</text>
  <text x="48" y="160" fill="#a1a5bc" font-family="Inter, sans-serif" font-size="13">• Escrito em TypeScript; roda em Node.js ou navegador</text>
  <text x="48" y="186" fill="#a1a5bc" font-family="Inter, sans-serif" font-size="13">• Importa pacotes NPM (delegua-node) e extensões JS</text>
  <text x="48" y="212" fill="#a1a5bc" font-family="Inter, sans-serif" font-size="13">• Suporta vários dialetos (Portugol, Mapler, Égua...)</text>
  <text x="48" y="238" fill="#a1a5bc" font-family="Inter, sans-serif" font-size="13">• FFI via despachador do ambiente (ex.: Koffi no Node)</text>
  <text x="48" y="264" fill="#a1a5bc" font-family="Inter, sans-serif" font-size="13">• Herança múltipla, closures e escopo via montão</text>
  <text x="48" y="294" fill="#7dd3fc" font-family="JetBrains Mono, monospace" font-size="12">Foco: ensino, web, ecossistema JavaScript/Node</text>

  <!-- Center Divider Badge -->
  <circle cx="560" cy="188" r="24" fill="#131024" stroke="#7c4dff" stroke-width="2"/>
  <text x="560" y="193" text-anchor="middle" fill="#c4b5fd" font-family="JetBrains Mono, monospace" font-size="13" font-weight="800">VS</text>

  <!-- Right Card: CGD -->
  <rect x="582" y="64" width="510" height="248" rx="14" fill="#0d0a1a" stroke="#5500fe" stroke-width="1.8"/>
  <rect x="602" y="82" width="186" height="24" rx="6" fill="#5500fe" fill-opacity="0.32"/>
  <text x="614" y="98" fill="#d8ccff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">CGD — COMPILADOR NATIVO</text>
  <text x="602" y="132" fill="#f3f4f8" font-family="Inter, sans-serif" font-size="20" font-weight="800">Compilador D → C99 + Runtime C</text>
  <text x="602" y="160" fill="#d4d2e6" font-family="Inter, sans-serif" font-size="13">• Gera executável nativo independente (sem Node/JS)</text>
  <text x="602" y="186" fill="#d4d2e6" font-family="Inter, sans-serif" font-size="13">• Recursos próprios: assincrona/aguardar, rotina, Canal</text>
  <text x="602" y="212" fill="#d4d2e6" font-family="Inter, sans-serif" font-size="13">• 24 bibliotecas cgd:* instaladas em ~/.delegua/cgd</text>
  <text x="602" y="238" fill="#d4d2e6" font-family="Inter, sans-serif" font-size="13">• Sem closures/eval/NPM; checagem estática E3101–E3112</text>
  <text x="602" y="264" fill="#d4d2e6" font-family="Inter, sans-serif" font-size="13">• CTFE //&gt;puro, LSP nativo, formatador e FFI C direta</text>
  <text x="602" y="294" fill="#a78bfa" font-family="JetBrains Mono, monospace" font-size="12">Foco: binários rápidos, previsíveis e biblioteca nativa</text>
</svg>
